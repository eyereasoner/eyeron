<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">A bound turns endless generation into a finite closure</title>
  <desc id="desc">An unbounded counter continues through an ellipsis, while a bounded counter stops at ten and reaches a fixpoint.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd7547"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.head{font:700 18px system-ui,sans-serif;fill:#304652}
      .num{font:700 17px ui-monospace,monospace;fill:#fff}.note{font:14px system-ui,sans-serif;fill:#5c6f79}
      .arrow{stroke:#bd7547;stroke-width:3;marker-end:url(#arrow)}.node{fill:#344d5b;stroke:#20313c;stroke-width:2}
    </style>
  </defs>
  <rect width="960" height="430" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">Termination needs a finite measure</text>
  <g transform="translate(55 90)">
    <rect width="400" height="250" rx="20" fill="#f7eeea" stroke="#bd795d" stroke-width="3"/>
    <text x="200" y="36" text-anchor="middle" class="head">unbounded constructor</text>
    <g transform="translate(35 90)">
      <circle cx="25" cy="25" r="25" class="node"/><text x="25" y="31" text-anchor="middle" class="num">0</text>
      <line x1="53" y1="25" x2="91" y2="25" class="arrow"/>
      <circle cx="120" cy="25" r="25" class="node"/><text x="120" y="31" text-anchor="middle" class="num">1</text>
      <line x1="148" y1="25" x2="186" y2="25" class="arrow"/>
      <circle cx="215" cy="25" r="25" class="node"/><text x="215" y="31" text-anchor="middle" class="num">2</text>
      <line x1="243" y1="25" x2="281" y2="25" class="arrow"/>
      <text x="325" y="34" text-anchor="middle" font-family="system-ui,sans-serif" font-size="30" fill="#8f5b46">…</text>
    </g>
    <text x="200" y="190" text-anchor="middle" class="note">value n produces n + 1 forever</text>
    <text x="200" y="220" text-anchor="middle" class="note">no finite fixpoint</text>
  </g>
  <g transform="translate(505 90)">
    <rect width="400" height="250" rx="20" fill="#edf4f0" stroke="#668e78" stroke-width="3"/>
    <text x="200" y="36" text-anchor="middle" class="head">bounded generation</text>
    <g transform="translate(35 90)">
      <circle cx="25" cy="25" r="25" class="node"/><text x="25" y="31" text-anchor="middle" class="num">0</text>
      <line x1="53" y1="25" x2="91" y2="25" class="arrow"/>
      <circle cx="120" cy="25" r="25" class="node"/><text x="120" y="31" text-anchor="middle" class="num">1</text>
      <line x1="148" y1="25" x2="186" y2="25" class="arrow"/>
      <circle cx="215" cy="25" r="25" class="node"/><text x="215" y="31" text-anchor="middle" class="num">…</text>
      <line x1="243" y1="25" x2="281" y2="25" class="arrow"/>
      <circle cx="310" cy="25" r="27" fill="#bd7547"/><text x="310" y="31" text-anchor="middle" class="num">10</text>
    </g>
    <text x="200" y="190" text-anchor="middle" class="note">guard: n &lt; limit</text>
    <text x="200" y="220" text-anchor="middle" class="note">measure: limit − n reaches zero</text>
  </g>
  <text x="480" y="390" text-anchor="middle" class="note">A safety limit stops a run; a mathematical bound explains why it completes.</text>
</svg>
