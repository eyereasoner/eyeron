<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Forward and backward reasoning travel in opposite directions</title>
  <desc id="desc">Forward reasoning starts with facts and materializes reusable conclusions. Backward reasoning starts with a goal and reduces it to supporting premises.</desc>
  <defs>
    <marker id="copper-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7547"/></marker>
    <marker id="iron-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#426454"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.head{font:700 18px system-ui,sans-serif;fill:#fff}
      .label{font:15px system-ui,sans-serif;fill:#30434e}.mono{font:14px ui-monospace,monospace;fill:#263944}
      .note{font:14px system-ui,sans-serif;fill:#60717b}.card{fill:#fff;stroke:#80939e;stroke-width:2}
    </style>
  </defs>
  <rect width="960" height="440" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">Two directions, one logical relationship</text>
  <g transform="translate(50 76)">
    <rect width="405" height="300" rx="20" fill="#eef2f4" stroke="#506a79" stroke-width="3"/>
    <path d="M0 20Q0 0 20 0H385Q405 0 405 20V50H0Z" fill="#344d5b"/>
    <text x="202" y="32" text-anchor="middle" class="head">forward · materialize</text>
    <rect x="28" y="90" width="110" height="66" rx="12" class="card"/>
    <text x="83" y="116" text-anchor="middle" class="mono">facts</text>
    <text x="83" y="140" text-anchor="middle" class="note">known graph</text>
    <path d="M145 123H250" stroke="#bd7547" stroke-width="5" marker-end="url(#copper-arrow)"/>
    <rect x="267" y="90" width="110" height="66" rx="12" fill="#fff7eb" stroke="#bd7547" stroke-width="2"/>
    <text x="322" y="116" text-anchor="middle" class="mono">closure</text>
    <text x="322" y="140" text-anchor="middle" class="note">new facts</text>
    <rect x="85" y="196" width="235" height="50" rx="12" fill="#fff"/>
    <text x="202" y="226" text-anchor="middle" class="mono">{ Human } ⇒ { Mortal }</text>
    <text x="202" y="276" text-anchor="middle" class="note">Useful when conclusions will be reused.</text>
  </g>
  <g transform="translate(505 76)">
    <rect width="405" height="300" rx="20" fill="#edf4f0" stroke="#668e78" stroke-width="3"/>
    <path d="M0 20Q0 0 20 0H385Q405 0 405 20V50H0Z" fill="#426454"/>
    <text x="202" y="32" text-anchor="middle" class="head">backward · solve</text>
    <rect x="28" y="90" width="110" height="66" rx="12" fill="#fff7eb" stroke="#bd7547" stroke-width="2"/>
    <text x="83" y="116" text-anchor="middle" class="mono">goal</text>
    <text x="83" y="140" text-anchor="middle" class="note">Mortal?</text>
    <path d="M260 123H155" stroke="#426454" stroke-width="5" marker-end="url(#iron-arrow)"/>
    <rect x="267" y="90" width="110" height="66" rx="12" class="card"/>
    <text x="322" y="116" text-anchor="middle" class="mono">premises</text>
    <text x="322" y="140" text-anchor="middle" class="note">Human?</text>
    <rect x="85" y="196" width="235" height="50" rx="12" fill="#fff"/>
    <text x="202" y="226" text-anchor="middle" class="mono">{ Mortal } ⇐ { Human }</text>
    <text x="202" y="276" text-anchor="middle" class="note">Useful for selective, bound goals.</text>
  </g>
  <text x="480" y="412" text-anchor="middle" class="note">Direction changes when work happens, what is stored, and how termination must be argued.</text>
</svg>
