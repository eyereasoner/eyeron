<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Inference proceeds in waves until a fixpoint</title>
  <desc id="desc">An explicit Human fact enables a Mortal fact, which enables a Needs Food fact. A final pass adds nothing and establishes the fixpoint.</desc>
  <defs>
    <linearGradient id="iron" x1="0" x2="1">
      <stop offset="0" stop-color="#263746"/>
      <stop offset="1" stop-color="#465d6d"/>
    </linearGradient>
    <linearGradient id="copper" x1="0" x2="1">
      <stop offset="0" stop-color="#b96f43"/>
      <stop offset="1" stop-color="#e0a061"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b96f43"/>
    </marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#1f2c35}.label{font:700 16px system-ui,sans-serif;fill:#fff}
      .body{font:15px ui-monospace,monospace;fill:#22323d}.small{font:14px system-ui,sans-serif;fill:#52636f}
      .card{fill:#f7f4ef;stroke:#cad3d9;stroke-width:2}.arrow{stroke:#b96f43;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">Closure grows in waves</text>
  <g transform="translate(45 80)">
    <rect width="190" height="230" rx="18" class="card"/>
    <rect width="190" height="48" rx="18" fill="url(#iron)"/>
    <path d="M0 30h190v18H0z" fill="url(#iron)"/>
    <text x="95" y="31" text-anchor="middle" class="label">C₀ · explicit</text>
    <text x="20" y="92" class="body">Socrates</text>
    <text x="20" y="119" class="body">  a Human</text>
    <text x="95" y="197" text-anchor="middle" class="small">source graph</text>
  </g>
  <path d="M240 195H285" class="arrow"/>
  <text x="263" y="174" text-anchor="middle" class="small">rule 1</text>
  <g transform="translate(290 80)">
    <rect width="190" height="230" rx="18" class="card"/>
    <rect width="190" height="48" rx="18" fill="url(#iron)"/>
    <path d="M0 30h190v18H0z" fill="url(#iron)"/>
    <text x="95" y="31" text-anchor="middle" class="label">C₁ · wave 1</text>
    <text x="20" y="89" class="body">Socrates</text>
    <text x="20" y="116" class="body">  a Human</text>
    <text x="20" y="157" class="body" fill="#9a542f">Socrates</text>
    <text x="20" y="184" class="body" fill="#9a542f">  a Mortal</text>
    <text x="95" y="215" text-anchor="middle" class="small">one new fact</text>
  </g>
  <path d="M485 195H530" class="arrow"/>
  <text x="508" y="174" text-anchor="middle" class="small">rule 2</text>
  <g transform="translate(535 80)">
    <rect width="190" height="230" rx="18" class="card"/>
    <rect width="190" height="48" rx="18" fill="url(#iron)"/>
    <path d="M0 30h190v18H0z" fill="url(#iron)"/>
    <text x="95" y="31" text-anchor="middle" class="label">C₂ · wave 2</text>
    <text x="20" y="89" class="body">… a Human</text>
    <text x="20" y="124" class="body">… a Mortal</text>
    <text x="20" y="165" class="body" fill="#9a542f">… needsFood</text>
    <text x="20" y="192" class="body" fill="#9a542f">  true</text>
    <text x="95" y="215" text-anchor="middle" class="small">one new fact</text>
  </g>
  <path d="M730 195H775" class="arrow"/>
  <text x="753" y="174" text-anchor="middle" class="small">next pass</text>
  <g transform="translate(780 80)">
    <rect width="135" height="230" rx="18" fill="#edf4f0" stroke="#82a894" stroke-width="2"/>
    <circle cx="67.5" cy="90" r="35" fill="url(#copper)"/>
    <path d="M50 90l12 12 25-28" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="67.5" y="154" text-anchor="middle" class="title" font-size="20">C₃ = C₂</text>
    <text x="67.5" y="184" text-anchor="middle" class="small">no new facts</text>
    <text x="67.5" y="210" text-anchor="middle" class="small">fixpoint</text>
  </g>
  <path d="M145 350H815" stroke="#d9d4cc" stroke-width="2"/>
  <text x="480" y="382" text-anchor="middle" class="small">The closure is explicit facts plus every distinct derived fact.</text>
</svg>
