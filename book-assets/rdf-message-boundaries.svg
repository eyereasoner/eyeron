<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
  <title id="title">RDF Message boundaries are preserved</title>
  <desc id="desc">Three ordered message envelopes contain two separate quoted payload graphs and an empty heartbeat. Rules inspect each payload without merging their observations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7547"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.head{font:700 16px system-ui,sans-serif;fill:#fff}
      .body{font:14px ui-monospace,monospace;fill:#263944}.note{font:14px system-ui,sans-serif;fill:#536671}
      .env{fill:#eef2f4;stroke:#506a79;stroke-width:3}.payload{fill:#fff7eb;stroke:#bd7547;stroke-width:2;stroke-dasharray:8 5}
      .arrow{stroke:#bd7547;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="470" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">A stream is ordered; each message is atomic</text>
  <path d="M300 210H356" class="arrow"/><path d="M604 210H660" class="arrow"/>
  <g transform="translate(55 82)">
    <rect width="245" height="275" rx="20" class="env"/>
    <path d="M0 20Q0 0 20 0H225Q245 0 245 20V48H0Z" fill="#344d5b"/>
    <text x="18" y="31" class="head">envelope 1 · offset 0</text>
    <rect x="25" y="76" width="195" height="130" rx="14" class="payload"/>
    <text x="42" y="103" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#955530">quoted payload</text>
    <text x="42" y="142" class="body">_:sensor :value 7</text>
    <text x="42" y="174" class="body">:time "10:00"</text>
    <text x="122" y="239" text-anchor="middle" class="note">non-empty</text>
  </g>
  <g transform="translate(357 82)">
    <rect width="247" height="275" rx="20" class="env"/>
    <path d="M0 20Q0 0 20 0H227Q247 0 247 20V48H0Z" fill="#344d5b"/>
    <text x="18" y="31" class="head">envelope 2 · offset 1</text>
    <circle cx="123.5" cy="143" r="50" fill="#edf4f0" stroke="#729280" stroke-width="3"/>
    <path d="M98 143h51" stroke="#729280" stroke-width="6" stroke-linecap="round"/>
    <text x="123.5" y="225" text-anchor="middle" class="note">empty heartbeat</text>
  </g>
  <g transform="translate(660 82)">
    <rect width="245" height="275" rx="20" class="env"/>
    <path d="M0 20Q0 0 20 0H225Q245 0 245 20V48H0Z" fill="#344d5b"/>
    <text x="18" y="31" class="head">envelope 3 · offset 2</text>
    <rect x="25" y="76" width="195" height="130" rx="14" class="payload"/>
    <text x="42" y="103" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#955530">quoted payload</text>
    <text x="42" y="142" class="body">_:sensor :value 9</text>
    <text x="42" y="174" class="body">:time "10:02"</text>
    <text x="122" y="239" text-anchor="middle" class="note">non-empty</text>
  </g>
  <path d="M120 396H840" stroke="#d8d2ca" stroke-width="2"/>
  <text x="480" y="426" text-anchor="middle" class="note">Repeated blank-node labels remain message-scoped; payload graphs are never silently flattened.</text>
</svg>
