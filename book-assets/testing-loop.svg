<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" role="img" aria-labelledby="title desc">
  <title id="title">A reasoning laboratory cycles through meaning, prediction, execution, proof, and regression</title>
  <desc id="desc">Five connected stations form a loop, with a disputed ground fact in the center.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd7547"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.head{font:700 16px system-ui,sans-serif;fill:#fff}
      .note{font:14px system-ui,sans-serif;fill:#5c6f79}.edge{stroke:#bd7547;stroke-width:4;fill:none;marker-end:url(#arrow)}
      .station{fill:#344d5b;stroke:#20313c;stroke-width:2}
    </style>
  </defs>
  <rect width="960" height="480" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">A theory improves by remembering surprises</text>
  <path d="M480 106C640 105 738 151 782 230" class="edge"/>
  <path d="M790 265C765 361 665 406 525 408" class="edge"/>
  <path d="M435 408C290 405 195 360 170 270" class="edge"/>
  <path d="M176 220C225 142 318 106 435 106" class="edge"/>
  <g transform="translate(405 72)"><rect width="150" height="68" rx="16" class="station"/><text x="75" y="28" text-anchor="middle" class="head">1 · meaning</text><text x="75" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">ground sentence</text></g>
  <g transform="translate(715 205)"><rect width="160" height="68" rx="16" class="station"/><text x="80" y="28" text-anchor="middle" class="head">2 · prediction</text><text x="80" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">expected closure</text></g>
  <g transform="translate(405 374)"><rect width="150" height="68" rx="16" class="station"/><text x="75" y="28" text-anchor="middle" class="head">3 · execute</text><text x="75" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">status + stats</text></g>
  <g transform="translate(85 205)"><rect width="160" height="68" rx="16" class="station"/><text x="80" y="28" text-anchor="middle" class="head">5 · regression</text><text x="80" y="51" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">preserve lesson</text></g>
  <g transform="translate(395 190)">
    <circle cx="85" cy="50" r="82" fill="#fff7eb" stroke="#bd7547" stroke-width="4"/>
    <text x="85" y="37" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#8f5433">4 · proof</text>
    <text x="85" y="65" text-anchor="middle" class="note">why did this</text><text x="85" y="86" text-anchor="middle" class="note">ground fact hold?</text>
  </g>
  <text x="480" y="466" text-anchor="middle" class="note">Every repaired surprise becomes a smaller test and a stronger semantic contract.</text>
</svg>
