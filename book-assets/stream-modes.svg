<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Three architectures for reasoning over RDF Messages</title>
  <desc id="desc">Independent evaluation processes each message separately, replay reasons over ordered envelopes, and a stateful host deliberately carries selected state between batches.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#bd7547"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.head{font:700 17px system-ui,sans-serif;fill:#344d5b}
      .label{font:14px system-ui,sans-serif;fill:#526671}.mono{font:13px ui-monospace,monospace;fill:#263944}
      .box{fill:#eef2f4;stroke:#526b7a;stroke-width:2}.msg{fill:#fff7eb;stroke:#bd7547;stroke-width:2}
      .arrow{stroke:#bd7547;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="500" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">Choose who owns cross-message state</text>
  <g transform="translate(35 85)">
    <rect width="280" height="330" rx="20" class="box"/><text x="140" y="34" text-anchor="middle" class="head">independent batches</text>
    <rect x="25" y="70" width="76" height="52" rx="10" class="msg"/><text x="63" y="101" text-anchor="middle" class="mono">msg₁</text>
    <rect x="179" y="70" width="76" height="52" rx="10" fill="#edf4f0" stroke="#668e78" stroke-width="2"/><text x="217" y="101" text-anchor="middle" class="mono">out₁</text>
    <line x1="110" y1="96" x2="168" y2="96" class="arrow"/>
    <rect x="25" y="155" width="76" height="52" rx="10" class="msg"/><text x="63" y="186" text-anchor="middle" class="mono">msg₂</text>
    <rect x="179" y="155" width="76" height="52" rx="10" fill="#edf4f0" stroke="#668e78" stroke-width="2"/><text x="217" y="186" text-anchor="middle" class="mono">out₂</text>
    <line x1="110" y1="181" x2="168" y2="181" class="arrow"/>
    <text x="140" y="255" text-anchor="middle" class="label">same prepared program</text><text x="140" y="281" text-anchor="middle" class="label">no retained facts</text>
  </g>
  <g transform="translate(340 85)">
    <rect width="280" height="330" rx="20" class="box"/><text x="140" y="34" text-anchor="middle" class="head">ordered replay</text>
    <rect x="25" y="70" width="230" height="110" rx="14" class="msg"/>
    <circle cx="65" cy="116" r="19" fill="#bd7547"/><text x="65" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#fff">1</text>
    <line x1="86" y1="116" x2="126" y2="116" class="arrow"/>
    <circle cx="150" cy="116" r="19" fill="#bd7547"/><text x="150" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#fff">2</text>
    <line x1="171" y1="116" x2="211" y2="116" class="arrow"/>
    <circle cx="230" cy="116" r="19" fill="#bd7547"/><text x="230" y="121" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#fff">3</text>
    <rect x="55" y="215" width="170" height="56" rx="12" fill="#edf4f0" stroke="#668e78" stroke-width="2"/>
    <text x="140" y="239" text-anchor="middle" class="mono">envelopes +</text><text x="140" y="260" text-anchor="middle" class="mono">quoted payloads</text>
    <path d="M140 183V205" class="arrow"/>
    <text x="140" y="305" text-anchor="middle" class="label">history is explicit data</text>
  </g>
  <g transform="translate(645 85)">
    <rect width="280" height="330" rx="20" class="box"/><text x="140" y="34" text-anchor="middle" class="head">stateful host</text>
    <rect x="25" y="72" width="80" height="52" rx="10" class="msg"/><text x="65" y="103" text-anchor="middle" class="mono">msg</text>
    <rect x="175" y="72" width="80" height="52" rx="10" fill="#edf4f0" stroke="#668e78" stroke-width="2"/><text x="215" y="103" text-anchor="middle" class="mono">result</text>
    <line x1="112" y1="98" x2="164" y2="98" class="arrow"/>
    <rect x="70" y="190" width="140" height="62" rx="14" fill="#344d5b"/>
    <text x="140" y="216" text-anchor="middle" font-family="system-ui,sans-serif" font-size="14" fill="#fff">application state</text><text x="140" y="238" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">selected history</text>
    <path d="M215 132C215 165 210 174 185 187" class="arrow"/><path d="M95 188C70 174 65 160 65 135" class="arrow"/>
    <text x="140" y="300" text-anchor="middle" class="label">persistence is deliberate</text>
  </g>
  <text x="480" y="462" text-anchor="middle" class="label">Eyeron supplies the first two modes; a host application must explicitly own the third.</text>
</svg>
