<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">An auditable decision moves through explicit graph layers</title>
  <desc id="desc">Source evidence is normalized into domain concepts, checked by an integrity fuse, converted to a verdict and reason, and presented with a proof running beneath every stage.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7547"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.head{font:700 16px system-ui,sans-serif;fill:#fff}
      .body{font:14px system-ui,sans-serif;fill:#40535e}.small{font:13px system-ui,sans-serif;fill:#60717b}
      .card{fill:#eef2f4;stroke:#526b7a;stroke-width:2}.arrow{stroke:#bd7547;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">A decision is a pipeline of accountable claims</text>
  <g transform="translate(35 90)">
    <g>
      <rect width="150" height="150" rx="16" class="card"/><path d="M0 16Q0 0 16 0H134Q150 0 150 16V44H0Z" fill="#344d5b"/>
      <text x="75" y="29" text-anchor="middle" class="head">source evidence</text>
      <text x="75" y="78" text-anchor="middle" class="body">submitted values</text><text x="75" y="105" text-anchor="middle" class="body">authority + time</text>
    </g>
    <line x1="158" y1="75" x2="198" y2="75" class="arrow"/>
    <g transform="translate(205)">
      <rect width="150" height="150" rx="16" class="card"/><path d="M0 16Q0 0 16 0H134Q150 0 150 16V44H0Z" fill="#344d5b"/>
      <text x="75" y="29" text-anchor="middle" class="head">normalization</text>
      <text x="75" y="78" text-anchor="middle" class="body">canonical terms</text><text x="75" y="105" text-anchor="middle" class="body">domain concepts</text>
    </g>
    <line x1="363" y1="75" x2="403" y2="75" class="arrow"/>
    <g transform="translate(410)">
      <rect width="150" height="150" rx="16" fill="#fff7eb" stroke="#bd7547" stroke-width="3"/><path d="M0 16Q0 0 16 0H134Q150 0 150 16V44H0Z" fill="#9b5d38"/>
      <text x="75" y="29" text-anchor="middle" class="head">integrity fuse</text>
      <text x="75" y="78" text-anchor="middle" class="body">conflicts?</text><text x="75" y="105" text-anchor="middle" class="body">blockers?</text>
    </g>
    <line x1="568" y1="75" x2="608" y2="75" class="arrow"/>
    <g transform="translate(615)">
      <rect width="150" height="150" rx="16" fill="#edf4f0" stroke="#668e78" stroke-width="3"/><path d="M0 16Q0 0 16 0H134Q150 0 150 16V44H0Z" fill="#426454"/>
      <text x="75" y="29" text-anchor="middle" class="head">verdict + reason</text>
      <text x="75" y="78" text-anchor="middle" class="body">Permit</text><text x="75" y="105" text-anchor="middle" class="body">because Rule R</text>
    </g>
    <line x1="773" y1="75" x2="813" y2="75" class="arrow"/>
    <g transform="translate(820)">
      <rect width="70" height="150" rx="16" class="card"/><text x="35" y="62" text-anchor="middle" class="body">API</text><text x="35" y="91" text-anchor="middle" class="body">or</text><text x="35" y="120" text-anchor="middle" class="body">text</text>
    </g>
  </g>
  <path d="M70 295H890" stroke="#668e78" stroke-width="5"/>
  <circle cx="110" cy="295" r="9" fill="#668e78"/><circle cx="315" cy="295" r="9" fill="#668e78"/><circle cx="520" cy="295" r="9" fill="#668e78"/><circle cx="725" cy="295" r="9" fill="#668e78"/>
  <text x="480" y="333" text-anchor="middle" font-family="system-ui,sans-serif" font-size="16" font-weight="700" fill="#426454">proof preserves the dependency path</text>
  <text x="480" y="380" text-anchor="middle" class="small">Each layer is a graph interface that can be inspected and tested independently.</text>
</svg>
