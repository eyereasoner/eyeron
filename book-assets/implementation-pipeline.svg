<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Eyeron implementation pipeline</title>
  <desc id="desc">Source text passes through the lexer and parser into a Document, then through the reasoner into either derived output or an N3 proof.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#bd7547"/>
    </marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}
      .head{font:700 17px system-ui,sans-serif;fill:#fff}
      .body{font:14px system-ui,sans-serif;fill:#526671}
      .file{fill:#fff7eb;stroke:#bd7547;stroke-width:3}
      .stage{fill:#344d5b;stroke:#20313c;stroke-width:2}
      .model{fill:#eef2f4;stroke:#526b7a;stroke-width:3}
      .result{fill:#edf4f0;stroke:#668e78;stroke-width:3}
      .flow{fill:none;stroke:#bd7547;stroke-width:4;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">One reasoning core, several visible stages</text>

  <g transform="translate(45 145)">
    <path d="M0 0H118L150 32V120H0Z" class="file"/>
    <path d="M118 0V32H150" fill="none" stroke="#bd7547" stroke-width="3"/>
    <text x="75" y="64" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#7f4a2f">source</text>
    <text x="75" y="91" text-anchor="middle" class="body">N3 or RDF</text>
  </g>

  <path d="M205 205H255" class="flow"/>
  <g transform="translate(265 162)">
    <rect width="120" height="86" rx="15" class="stage"/>
    <text x="60" y="38" text-anchor="middle" class="head">lexer</text>
    <text x="60" y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">characters → tokens</text>
  </g>

  <path d="M395 205H445" class="flow"/>
  <g transform="translate(455 162)">
    <rect width="120" height="86" rx="15" class="stage"/>
    <text x="60" y="38" text-anchor="middle" class="head">parser</text>
    <text x="60" y="63" text-anchor="middle" font-family="system-ui,sans-serif" font-size="13" fill="#dce5e9">tokens → AST</text>
  </g>

  <path d="M585 205H635" class="flow"/>
  <g transform="translate(645 145)">
    <rect width="150" height="120" rx="18" class="model"/>
    <text x="75" y="39" text-anchor="middle" font-family="system-ui,sans-serif" font-size="17" font-weight="700" fill="#344d5b">Document</text>
    <text x="75" y="70" text-anchor="middle" class="body">facts · rules</text>
    <text x="75" y="94" text-anchor="middle" class="body">prefixes · sources</text>
  </g>

  <g transform="translate(650 285)">
    <rect width="140" height="48" rx="14" class="stage"/>
    <text x="70" y="30" text-anchor="middle" class="head">reasoner</text>
  </g>
  <path d="M720 265V285" stroke="#bd7547" stroke-width="4"/>

  <g transform="translate(840 205)">
    <rect width="90" height="70" rx="15" class="result"/>
    <text x="45" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#426454">derived</text>
    <text x="45" y="52" text-anchor="middle" class="body">output</text>
  </g>
  <g transform="translate(840 300)">
    <rect width="90" height="70" rx="15" class="result"/>
    <text x="45" y="30" text-anchor="middle" font-family="system-ui,sans-serif" font-size="15" font-weight="700" fill="#426454">N3</text>
    <text x="45" y="52" text-anchor="middle" class="body">proof</text>
  </g>

  <path d="M790 309H815V240H830" class="flow"/>
  <path d="M815 309V335H830" class="flow"/>
  <text x="480" y="390" text-anchor="middle" class="body">The CLI, Rust library, and WebAssembly API are front ends around this shared pipeline.</text>
</svg>
