<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
  <title id="title">A list term can represent a symbolic expression tree</title>
  <desc id="desc">The list add two multiply three four unfolds into a tree, whose multiplication evaluates to twelve and whose root evaluates to fourteen.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#bd7547"/></marker>
    <style>
      .title{font:700 24px system-ui,sans-serif;fill:#20313c}.mono{font:15px ui-monospace,monospace;fill:#263944}
      .label{font:14px system-ui,sans-serif;fill:#526671}.op{fill:#344d5b;stroke:#20313c;stroke-width:2}
      .value{fill:#fff7eb;stroke:#bd7547;stroke-width:2}.edge{stroke:#80939e;stroke-width:3}
    </style>
  </defs>
  <rect width="960" height="460" rx="24" fill="#fbfaf7"/>
  <text x="480" y="42" text-anchor="middle" class="title">Structure first, interpretation second</text>
  <rect x="55" y="100" width="330" height="74" rx="16" fill="#eef2f4" stroke="#526b7a" stroke-width="3"/>
  <text x="220" y="144" text-anchor="middle" class="mono">("add" 2 ("multiply" 3 4))</text>
  <path d="M395 137H475" stroke="#bd7547" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="435" y="116" text-anchor="middle" class="label">read as tree</text>
  <g transform="translate(510 75)">
    <line x1="170" y1="66" x2="75" y2="158" class="edge"/><line x1="170" y1="66" x2="265" y2="158" class="edge"/>
    <line x1="265" y1="198" x2="220" y2="280" class="edge"/><line x1="265" y1="198" x2="310" y2="280" class="edge"/>
    <rect x="115" y="25" width="110" height="55" rx="14" class="op"/><text x="170" y="59" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#fff">add</text>
    <circle cx="75" cy="178" r="30" class="value"/><text x="75" y="185" text-anchor="middle" class="mono">2</text>
    <rect x="210" y="150" width="110" height="55" rx="14" class="op"/><text x="265" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#fff">multiply</text>
    <circle cx="220" cy="305" r="30" class="value"/><text x="220" y="312" text-anchor="middle" class="mono">3</text>
    <circle cx="310" cy="305" r="30" class="value"/><text x="310" y="312" text-anchor="middle" class="mono">4</text>
    <rect x="330" y="145" width="90" height="66" rx="14" fill="#edf4f0" stroke="#668e78" stroke-width="2"/>
    <text x="375" y="173" text-anchor="middle" class="label">value</text><text x="375" y="198" text-anchor="middle" class="mono">12</text>
    <rect x="235" y="24" width="90" height="58" rx="14" fill="#edf4f0" stroke="#668e78" stroke-width="2"/>
    <text x="280" y="48" text-anchor="middle" class="label">value</text><text x="280" y="70" text-anchor="middle" class="mono">14</text>
  </g>
  <text x="220" y="232" text-anchor="middle" class="label">The list is inert syntax.</text>
  <text x="220" y="257" text-anchor="middle" class="label">An evaluator relation assigns values.</text>
  <text x="480" y="420" text-anchor="middle" class="label">Object-language variables must also be represented as data, not confused with N3 variables.</text>
</svg>
