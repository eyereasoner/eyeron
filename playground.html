    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>The Eyeron N3 Playground</title>
    <link rel="icon" href="assets/eye.png" type="image/png" />
    <style>
      * { box-sizing: border-box; }
      :root { color-scheme: light; --bg: #f5f5f7; --panel: #fff; --border: #d1d5db; --text: #111827; --muted: #6b7280; --accent: #2563eb; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      input, select, button { font: inherit; }
      button, select, input[type="text"], input[type="url"], input[type="number"] { min-height: 40px; border-radius: 0.5rem; }
      button { cursor: pointer; border: 0; padding: 0.5rem 0.85rem; background: var(--accent); color: #fff; font-weight: 600; }
      button.secondary { background: #e5e7eb; color: var(--text); }
      button:disabled { cursor: default; opacity: 0.5; }
      button:hover:not(:disabled) { filter: brightness(0.95); }
      input[type="text"], input[type="url"], input[type="number"], select { min-width: 0; border: 1px solid var(--border); padding: 0.45rem 0.6rem; background: var(--panel); color: var(--text); }
      :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      [hidden] { display: none !important; }
      .page { max-width: 1500px; margin: 0 auto; padding: calc(1.5rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right)) calc(2rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left)); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-template-areas: "heading options" "actions options" "input output"; align-items: start; gap: 1rem; }
      header { grid-area: heading; display: flex; align-items: center; gap: 1rem; text-align: left; }
      header .logo { display: block; flex: none; border-radius: 50%; }
      header .header-copy { min-width: 0; }
      header h1 { margin: 0; font-size: 1.9rem; font-weight: 650; letter-spacing: -0.02em; }
      header p { margin: 0.35rem 0 0; color: var(--muted); font-size: 0.92rem; line-height: 1.55; }
      header a { color: var(--accent); }
      .card { min-width: 0; padding: 1rem 1.25rem; border: 1px solid #e5e7eb; border-radius: 0.85rem; background: var(--panel); }
      h2, legend { margin: 0 0 0.75rem; padding: 0; font-size: 1rem; font-weight: 650; }
      .row { display: flex; align-items: center; flex-wrap: wrap; gap: 0.6rem; }
      .row + .row { margin-top: 0.75rem; }
      .grow { flex: 1 1 12rem; }
      .field { display: grid; gap: 0.3rem; }
      .field > span, .field > label { font-size: 0.85rem; font-weight: 600; }
      .options-fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0.5rem 0.75rem; }
      .output-mode { grid-column: 1 / -1; display: flex; align-items: center; gap: 0.75rem; }
      .output-mode select { flex: 1; }
      .flags { gap: 0.8rem 1.5rem; }
      .toggle { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem; }
      .toggle input { width: 1rem; height: 1rem; accent-color: var(--accent); }
      .hint, .status { color: var(--muted); font-size: 0.84rem; line-height: 1.5; }
      .hint { margin: 0.65rem 0 0; }
      .command { margin: 0.5rem 0 0; max-height: 5rem; padding: 0.45rem 0.6rem; background: #f9fafb; border-radius: 0.5rem; overflow: auto; overflow-wrap: anywhere; white-space: pre-wrap; font-size: 0.8rem; }
      .grid { display: contents; }
      .input-card { grid-area: input; }
      .options-card { grid-area: options; align-self: stretch; padding: 0.85rem 1rem; }
      .options-card h2 { margin-bottom: 0.5rem; }
      .options-card .flags { margin-top: 0.5rem; gap: 0.25rem 1rem; }
      .options-card .toggle { min-height: 32px; }
      .options-card input[type="text"], .options-card input[type="number"], .options-card select { min-height: 34px; padding: 0.35rem 0.5rem; font-size: 0.9rem; }
      .output-card { grid-area: output; }
      .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 0.65rem; margin-bottom: 0.75rem; }
      .panel-heading h2 { margin: 0; }
      .example-select { flex: 0 1 20rem; }
      .input-source { margin: 0 0 0.5rem; color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }
      .additional-input { margin-top: 1rem; }
      .additional-input h3 { margin: 0 0 0.5rem; font-size: 0.9rem; }
      .url-row { margin-bottom: 0.75rem; }
      .url-row input { flex: 1 1 14rem; }
      .proof-input { margin-top: 1rem; }
      .share-result { flex: 1 1 100%; min-width: 0; }
      .share-result input { width: 100%; }
      /* An editor is a transparent textarea over a colored copy of its text.
         Both share one grid cell, font, and wrapping, so the caret and the
         colors stay aligned; the layer changes colors only, never weight or
         slant, which would move the text under the caret. */
      .editor { display: grid; min-height: 32rem; border: 1px solid var(--border); border-radius: 0.5rem; background: var(--panel); }
      .editor > textarea, .editor > .highlight { grid-area: 1 / 1; min-height: 100%; margin: 0; padding: 0.5rem 0.65rem; border: 0; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 0.87rem; line-height: 1.45; tab-size: 4; white-space: pre-wrap; overflow-wrap: anywhere; }
      .editor > textarea { overflow: hidden; resize: none; background: transparent; color: transparent; caret-color: var(--text); }
      .editor > textarea::selection { color: transparent; background: #22bde747; }
      .editor > textarea:focus-visible { outline: none; }
      .editor:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
      .editor > .highlight { pointer-events: none; color: var(--text); }
      #proof-panel .editor { min-height: 15rem; }
      .additional-input .editor { min-height: 18rem; }
      .output-card .editor { min-height: 24rem; }
      .t-comment { color: var(--muted); }
      .t-keyword { color: #b3261e; }
      .t-var { color: #0b6f8c; }
      .t-blank { color: #a0469b; }
      .t-string { color: #2b7a2f; }
      .t-iri { color: #6c3fb5; }
      .t-number { color: #9a5200; }
      .t-brace { color: var(--accent); }
      .t-punct { color: var(--muted); }
      .messages { margin: 0.85rem 0 0; max-height: 18rem; padding: 0.75rem; border-radius: 0.5rem; background: #fef2f2; color: #991b1b; font-size: 0.82rem; line-height: 1.45; white-space: pre-wrap; overflow: auto; overflow-wrap: anywhere; }
      .run-toolbar { grid-area: actions; align-self: stretch; position: sticky; top: 0; z-index: 10; display: flex; align-items: center; align-content: start; flex-wrap: wrap; gap: 0.6rem 1.25rem; box-shadow: 0 3px 8px #1118270a; }
      .run-toolbar .status { flex: 1 1 12rem; min-width: 0; margin: 0; overflow-wrap: anywhere; }
      .run-toolbar #share-status { flex-basis: 100%; }
      .actions button { color: var(--text); }
      #run { background: #48e654; }
      #stop { background: #ff472f; }
      #share-link { background: #22bde7; }
      #create-gist-share { background: #fcfa44; }
      .error { color: #b91c1c; }
      .ok { color: #047857; }
      @media (max-width: 980px) { .page { grid-template-columns: minmax(0, 1fr); grid-template-areas: "heading" "actions" "input" "options" "output"; } }
      @media (max-width: 640px) {
        header { align-items: flex-start; gap: 0.75rem; }
        header .logo { width: 48px; height: 48px; }
        .card { padding: 1rem; }
        .page { padding-top: calc(1rem + env(safe-area-inset-top)); }
        header h1 { font-size: 1.5rem; }
        .run-toolbar { padding-top: calc(0.75rem + env(safe-area-inset-top)); padding-bottom: 0.75rem; }
        .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; width: 100%; }
        .actions button { padding-inline: 0.5rem; font-size: 0.94rem; white-space: normal; }
        .run-toolbar .status { flex-basis: 100%; }
        .options-fields { gap: 0.75rem; }
        .options-fields .field > span { overflow-wrap: anywhere; }
        .panel-heading { flex-wrap: wrap; }
        .example-select { flex: 1 1 100%; }
        .url-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
        button, select, input[type="text"], input[type="url"], input[type="number"] { min-height: 44px; font-size: 16px; }
        .options-card input[type="text"], .options-card input[type="number"], .options-card select { min-height: 44px; font-size: 16px; }
        .options-card .toggle { min-height: 44px; }
        .toggle { min-height: 44px; }
        .flags { gap: 0 1rem; }
        .editor { min-height: 22rem; min-height: clamp(16rem, 50svh, 28rem); }
        .editor > textarea, .editor > .highlight { font-size: 16px; }
        .additional-input .editor, #proof-panel .editor { min-height: 16rem; }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <header>
        <img class="logo" src="assets/eye.png" alt="" width="64" height="64">
        <div class="header-copy">
          <h1>The Eyeron Playground</h1>
          <p>Write N3 or try an example with <a href="https://github.com/eyereasoner/eyeron">eyeron</a>.</p>
          <p class="hint">Version <strong id="version">…</strong></p>
        </div>
      </header>

      <section class="card run-toolbar" aria-label="Run and share controls">
        <div class="row actions">
          <button id="run" type="button" disabled>Run</button>
          <button id="stop" type="button" disabled>Stop</button>
          <button id="share-link" type="button" title="Copy a link containing the current inputs, proof, and options.">Share link</button>
          <button id="create-gist-share" type="button" title="Upload the current inputs, proof, and options to an unlisted GitHub Gist and copy a short link.">Create Gist share</button>
        </div>
        <p id="status" class="status" role="status">Loading eyeron…</p>
        <p id="share-status" class="status" role="status" hidden></p>
        <label id="share-result" class="field share-result" hidden><span>Share link</span><input id="share-url" type="text" readonly spellcheck="false" /></label>
      </section>

      <div class="grid">
        <div class="card input-card">
          <div class="panel-heading">
            <h2>Input</h2>
            <select id="examples" class="example-select" aria-label="Load a bundled example"><option value="">Load an example…</option></select>
          </div>
          <form id="input-url-form" class="row url-row">
            <input id="input-url" type="url" placeholder="https://example.org/input.n3" aria-label="Input URL" autocomplete="url" autocapitalize="off" spellcheck="false" required />
            <button id="load-url" class="secondary" type="submit">Load URL</button>
          </form>
          <p id="input-source" class="input-source" hidden></p>
          <textarea id="input" spellcheck="false" aria-label="Input text"></textarea>
          <p class="hint">Edit the N3 above, choose an example, or load a URL. Loading replaces the input.</p>
          <div id="additional-inputs"></div>
          <section id="proof-panel" class="proof-input" aria-labelledby="proof-heading" hidden>
            <h2 id="proof-heading">Proof to check</h2>
            <form id="proof-url-form" class="row url-row"><input id="proof-url" type="url" placeholder="https://example.org/proof.n3" aria-label="Proof URL" autocapitalize="off" spellcheck="false" required /><button id="load-proof-url" class="secondary" type="submit">Load URL</button></form>
            <textarea id="proof-input" spellcheck="false" aria-label="Saved N3 proof"></textarea>
          </section>
        </div>
        <section class="card options-card" aria-labelledby="options-heading">
          <h2 id="options-heading">Options</h2>
          <div class="options-fields">
            <label class="field output-mode" for="mode"><span>Output</span>
              <select id="mode">
                <option value="">Conclusions (default)</option>
                <option value="--ast">-a, --ast · Parsed AST</option>
                <option value="--proof">-p, --proof · N3 proof</option>
                <option value="--prove-and-check">-c, --prove-and-check · Generate and check a proof</option>
                <option value="--check-proof">--check-proof FILE · Check a saved proof</option>
              </select>
            </label>
            <label class="field" for="base-iri"><span>--base-iri IRI</span><input id="base-iri" type="text" placeholder="Use each input's base" spellcheck="false" /></label>
            <label class="field" for="max-backward-depth"><span>--max-backward-depth N</span><input id="max-backward-depth" type="number" min="0" step="1" placeholder="32 (default)" /></label>
          </div>
          <div class="row flags">
            <label class="toggle" title="RDF/TriG compatibility"><input id="rdf" type="checkbox" /><span><code>-r, --rdf</code></span></label>
            <label class="toggle" title="Stream output after fixpoint"><input id="stream" type="checkbox" /><span><code>-s, --stream</code></span></label>
            <label class="toggle" title="Reason over RDF Messages independently"><input id="stream-messages" type="checkbox" /><span><code>--stream-messages</code></span></label>
          </div>
          <pre class="command" aria-label="Equivalent command"><code id="command">eyeron -</code></pre>
        </section>
        <div class="card output-card">
          <div class="panel-heading"><h2>Output</h2><button id="save-output" class="secondary" type="button" disabled>Save output</button></div>
          <textarea id="output" spellcheck="false" aria-label="Command output"></textarea>
          <pre id="messages" class="messages" aria-label="Command messages" hidden></pre>
        </div>
      </div>
    </main>

      // One pass over N3 text, in the lexer's token kinds: comments, long and
      // short strings, IRIs, keywords and arrows, variables, blank nodes,
      // prefixed names, language tags, numbers, bare words, and punctuation.
      const n3Tokens = new RegExp([
        /(?<comment>#[^\n]*)/,
        /(?<string>"""[\s\S]*?(?:"""|$)|'''[\s\S]*?(?:'''|$)|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')/,
        /(?<iri><[^\s<>"{}|^`\\]*>)/,
        /(?<keyword>@(?:prefix|base|forAll|forSome|keywords|version)\b|=>|<=|=)/,
        /(?<variable>\?[\p{L}\p{N}_-]+)/,
        /(?<blank>_:[\p{L}\p{N}_-]+(?:\.[\p{L}\p{N}_-]+)*)/,
        /(?<name>(?:\p{L}[\p{L}\p{N}_-]*(?:\.[\p{L}\p{N}_-]+)*)?:(?:[\p{L}\p{N}_%-]+(?:[.:][\p{L}\p{N}_%-]+)*)?)/,
        /(?<language>@[A-Za-z]+(?:-[A-Za-z0-9]+)*)/,
        /(?<number>[+-]?(?:\d+(?:\.\d+)?|\.\d+)(?:[eE][+-]?\d+)?)/,
        /(?<word>\p{L}[\p{L}\p{N}_-]*)/,
        /(?<brace>[{}])/,
        /(?<punct>[()[\].;,]|\^\^)/,
      ].map((part) => part.source).join('|'), 'gu');
      const n3Words = /^(?:a|is|of|has|true|false|prefix|base|version)$/i;
      const tokenClasses = { comment: 't-comment', string: 't-string', iri: 't-iri', keyword: 't-keyword', variable: 't-var',
        blank: 't-blank', name: 't-iri', language: 't-string', number: 't-number', brace: 't-brace', punct: 't-punct' };
      // Coloring a very large document would stall typing; it is shown plain.
      const maxHighlighted = 200000;

      function escapeHtml(text) {
        return text.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
      }

      /** N3 sources and results share one lexical coloring. */
      function highlight(text) {
        let html = '';
        let at = 0;
        for (const match of text.matchAll(n3Tokens)) {
          const [kind] = Object.entries(match.groups).find(([, value]) => value !== undefined);
          const className = kind === 'word' ? (n3Words.test(match[0]) ? 't-keyword' : '') : tokenClasses[kind];
          html += escapeHtml(text.slice(at, match.index));
          html += className ? `<span class="${className}">${escapeHtml(match[0])}</span>` : escapeHtml(match[0]);
          at = match.index + match[0].length;
        }
        return html + escapeHtml(text.slice(at));

      // The subset of an editor the page uses: value, change events, a

      function createEditor(textarea, { label, readOnly = false } = {}) {
        const frame = document.createElement('div');
        frame.className = 'editor';
        const layer = document.createElement('pre');
        layer.className = 'highlight';
        layer.setAttribute('aria-hidden', 'true');
        textarea.replaceWith(frame);
        frame.append(layer, textarea);
        textarea.spellcheck = false;
        textarea.readOnly = readOnly;
        if (label) textarea.setAttribute('aria-label', label);
        const listeners = [];
        let colored = true;
        let pending = [];
        let frameRequested = false;
        function paint() {
          frameRequested = false;
          if (pending.length) { textarea.value += pending.join(''); pending = []; }
          const text = textarea.value;
          // A trailing space keeps a final empty line as tall as the textarea's.
          if (colored && text.length <= maxHighlighted) layer.innerHTML = highlight(text) + ' ';
          else layer.textContent = text + ' ';
        }
        textarea.addEventListener('input', () => { paint(); for (const listener of listeners) listener(); });
        paint();
        return {
          getValue: () => { if (pending.length) paint(); return textarea.value; },
          setValue(text) {
            pending = [];
            textarea.value = text;
            paint();
            for (const listener of listeners) listener();
          },
          // Streamed output arrives in many small pieces; paint once a frame.
          append(text) {
            pending.push(text);
            if (!frameRequested) { frameRequested = true; requestAnimationFrame(paint); }
          },
          on(event, listener) { if (event === 'change') listeners.push(listener); },
          setOption(name, value) {
            if (name === 'readOnly') textarea.readOnly = value;
            if (name === 'mode') { colored = value === 'n3'; paint(); }
          },
        };
      }

      function normalizeState(raw) {
        if (!raw || typeof raw !== 'object' || (raw.v !== undefined && raw.v !== 1)) throw new Error('Unsupported playground state.');
        if (!Array.isArray(raw.sources) || !raw.sources.length || !raw.sources.every((source) =>

      function bytesToBase64Url(bytes) {
        let binary = '';
        for (let offset = 0; offset < bytes.length; offset += 0x8000) binary += String.fromCharCode(...bytes.subarray(offset, offset + 0x8000));
        return btoa(binary).replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/, '');
      }

      function base64UrlToBytes(value) {
        return Uint8Array.from(atob(value.replaceAll('-', '+').replaceAll('_', '/')), (character) => character.charCodeAt(0));
      }

      async function packState(snapshot) {
        const json = JSON.stringify(snapshot);
        const plain = 'j.' + bytesToBase64Url(new TextEncoder().encode(json));
        try {
          const stream = new Blob([json]).stream().pipeThrough(new CompressionStream('gzip'));
          const compressed = 'g.' + bytesToBase64Url(new Uint8Array(await new Response(stream).arrayBuffer()));
          if (compressed.length < plain.length) return compressed;
        } catch { /* Browsers without gzip support can still share JSON links. */ }
        return plain;
      }

      async function unpackState(token) {
        if (!/^[gj]\.[A-Za-z0-9_-]+$/.test(token)) throw new Error('Invalid playground share link.');
        const bytes = base64UrlToBytes(token.slice(2));
        let json;
        if (token.startsWith('g.')) {
          if (typeof DecompressionStream === 'undefined') throw new Error('This browser cannot open compressed links. Ask for a Gist share.');
          json = await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
        } else json = new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        return normalizeState(JSON.parse(json));
      }

      function shareBaseUrl() {
        const url = new URL(location.href);
        for (const key of ['example', 'ex', 'state', 's', 'stateurl']) url.searchParams.delete(key);

      }

      async function makeShareUrl(snapshot) {
        const url = shareBaseUrl();
        const defaultOptions = !snapshot.mode && !snapshot.rdf && !snapshot.stream && !snapshot.streamMessages &&
          !snapshot.baseIri && snapshot.maxBackwardDepth === '' && !snapshot.proof.text;
        if (bundledExamplesN3.includes(snapshot.example) && defaultOptions) {
          try {
            if (originalExample?.name !== snapshot.example) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 10000);
              try { originalExample = { name: snapshot.example, sources: await readExampleSources(snapshot.example, controller.signal) }; }
              finally { clearTimeout(timeout); }
            }
            const originals = originalExample.sources;
            if (snapshot.sources.length === originals.length && snapshot.sources.every((source, index) =>
              source.name === originals[index].name && source.text === originals[index].text && source.baseIri === originals[index].baseIri)) {
              url.search = '';
              url.hash = 'example=' + encodeURIComponent(snapshot.example.slice(0, -3));
              return url.href;
            }
          } catch { /* A failed reference check can still share the full snapshot. */ }
        }
        url.hash = 'state=' + await packState(snapshot);
        return url.href;
      }

      async function createGistShareUrl(snapshot, token) {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 20000);
        try {
          const response = await fetch('https://api.github.com/gists', {
            method: 'POST', credentials: 'omit', cache: 'no-store', referrerPolicy: 'no-referrer', signal: controller.signal,
            headers: { Accept: 'application/vnd.github+json', 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
            body: JSON.stringify({ description: 'Eyeron playground shared state', public: false,
              files: { 'eyeron-playground-state.json': { content: JSON.stringify(snapshot, null, 2) + '\n' } } }),
          });
          const payload = await response.json().catch(() => null);
          if (!response.ok) {
            if (response.status === 401 || response.status === 403) { try { sessionStorage.removeItem(gistTokenKey); } catch {} }
            throw new Error(`GitHub Gist HTTP ${response.status}: ${payload?.message || 'Could not create the Gist.'}`);
          }
          const raw = payload?.files?.['eyeron-playground-state.json']?.raw_url;
          if (typeof raw !== 'string' || !raw.startsWith('https://gist.githubusercontent.com/')) throw new Error('GitHub did not return the Gist state URL.');
          const url = shareBaseUrl();
          url.searchParams.set('stateurl', raw);
          return url.href;
        } catch (error) {
          if (error.name === 'AbortError') throw new Error('GitHub Gist request timed out.');
          throw error;
        } finally { clearTimeout(timeout); }
      }

      async function copyShareUrl(url) {

      async function sharePlayground(useGist) {
        if (busy || sharing) return;
        const current = state();
        const snapshot = { ...current, sources: current.sources.map((source) => ({ ...source })) };
        let token = '';
        if (useGist) {
          try { token = sessionStorage.getItem(gistTokenKey) || ''; } catch {}
          if (!token) token = prompt('Enter a GitHub token with gist permission to upload these inputs, proof, and options to an unlisted Gist. Anyone with its link can read it. The token stays in this tab for this session only.', '') || '';
          token = token.trim().replace(/^(?:Bearer|token)\s+/i, '').replace(/^['"]|['"]$/g, '').trim();
          if (!token) { setShareStatus('Gist sharing cancelled.'); return; }
          try { sessionStorage.setItem(gistTokenKey, token); } catch {}
        }
        sharing = true;
        updateShareButtons();
        byId('share-result').hidden = true;
        setShareStatus(useGist ? 'Creating an unlisted GitHub Gist…' : 'Creating share link…');
        try {
          const url = useGist ? await createGistShareUrl(snapshot, token) : await makeShareUrl(snapshot);
          const copied = await copyShareUrl(url);
          const long = !useGist && url.length > 2000 ? ' Use Create Gist share for a shorter link.' : '';
          setShareStatus((copied ? (useGist ? 'Gist share link copied.' : 'Share link copied.') : 'Select and copy the link below.') + long, 'ok');
        } catch (error) { setShareStatus('Could not share: ' + error.message, 'error'); }
        finally { sharing = false; updateShareButtons(); }
      }

      function ensureWorker() {
        if (worker) return workerReady;
        // Refresh the glue and binary together: Pages caches both URLs across
        // releases, and wasm-bindgen's default URL drops the module's query.
        const moduleUrl = new URL('./pkg/eyeron.js', location.href);
        const wasmUrl = new URL('./pkg/eyeron_bg.wasm', location.href);
        const cacheKey = Date.now().toString(36);
        moduleUrl.searchParams.set('v', cacheKey);
        wasmUrl.searchParams.set('v', cacheKey);
        const code = `
          let engine;
          self.onmessage = (event) => {
            try {
              const report = engine.runCliReport(JSON.stringify(event.data), (text) => self.postMessage({ type: 'output', text }));
              self.postMessage({ type: 'done', report: JSON.parse(report) });
            } catch (error) { self.postMessage({ type: 'error', message: String(error.message || error) }); }
          };
          import(${JSON.stringify(moduleUrl.href)}).then(async (module) => {
            await module.default({ module_or_path: ${JSON.stringify(wasmUrl.href)} }); engine = module;
            self.postMessage({ type: 'ready', version: module.version() });
          }).catch((error) => self.postMessage({ type: 'error', message: String(error.message || error) }));
        `;
        workerUrl = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
        worker = new Worker(workerUrl, { type: 'module' });
        workerReady = new Promise((resolve, reject) => {
          failReady = reject;
          worker.onmessage = (event) => {
            const message = event.data;
            if (message.type === 'ready') {
              URL.revokeObjectURL(workerUrl); workerUrl = null;
              byId('version').textContent = message.version;
              failReady = null;
              resolve();
            } else if (message.type === 'output') {
              output.append(message.text);
              if (message.text) byId('save-output').disabled = false;
            } else if (message.type === 'done') {
              if (finishRun) finishRun(message.report);
              finishRun = failRun = null;
            } else if (message.type === 'error') {
              if (failRun) failRun(new Error(message.message));
              reject(new Error(message.message));
              terminateWorker();
            }
          };
          worker.onerror = (event) => {
            const error = new Error(event.message || 'Could not start eyeron.');
            if (failRun) failRun(error);
            reject(error);
            terminateWorker();
          };
        });
        return workerReady;
      }

      function terminateWorker() {
        if (failReady) failReady(new Error('Stopped.'));
        failReady = null;
        if (worker) worker.terminate();
        if (workerUrl) URL.revokeObjectURL(workerUrl);
        worker = workerReady = workerUrl = null;
      }

      async function run(args = argumentsForRun()) {
        if (busy) return;
        if (!args.includes('--help') && !args.includes('--version')) {
          const names = sources.map((source) => source.name.trim() || '-');
          const duplicate = names.find((name, index) => names.indexOf(name) !== index);
          if (duplicate) {
            setStatus(`More than one saved input is named ${duplicate}. Load an example or URL to replace the saved inputs.`, 'error');
            return;
          }
        }
        if (!byId('max-backward-depth').checkValidity() && !args.includes('--help') && !args.includes('--version')) {
          byId('max-backward-depth').reportValidity();
          return;
        }
        setBusy(true);
        output.setValue('');
        output.setOption('mode', args.some((arg) => ['--ast', '--prove-and-check', '--check-proof', '--help', '--version'].includes(arg)) ? null : 'n3');
        byId('messages').hidden = true;
        byId('messages').textContent = '';
        const started = performance.now();
        setStatus('Running…');
        try {
          await ensureWorker();
          const request = { args, sources, proof: { name: proofName, text: proof.getValue() } };
          const report = await new Promise((resolve, reject) => { finishRun = resolve; failRun = reject; worker.postMessage(request); });
          byId('messages').textContent = report.stderr;
          byId('messages').hidden = !report.stderr;
          const verdict = report.exitCode === 0 ? 'Done' : report.exitCode === 65 ? 'Inference fuse' : 'Failed';
          setStatus(`${verdict} · exit ${report.exitCode} · ${((performance.now() - started) / 1000).toFixed(2)} s`, report.ok ? 'ok' : 'error');
          revealPanel(document.querySelector('.output-card'));
        } catch (error) {
          setStatus(error.message, error.message === 'Stopped.' ? '' : 'error');
        } finally { setBusy(false); }
      }

      async function fetchSource(url, name, signal) {
        const value = new URL(url, location.href);
        if (!['http:', 'https:'].includes(value.protocol)) throw new Error('Use an HTTP or HTTPS input URL.');
        const response = await fetch(value, { signal, referrerPolicy: 'no-referrer' });
        if (!response.ok) throw new Error(`Could not load ${value.href}: HTTP ${response.status}.`);
        return { name: name || response.url, text: await response.text(), baseIri: response.url };
      }

      async function loadInputs(action) {
        if (busy) return;
        setBusy(true);
        setStatus('Loading inputs…');
        loadController = new AbortController();
        try { await action(loadController.signal); setStatus('Inputs ready.'); }
        catch (error) { setStatus(error.name === 'AbortError' ? 'Stopped.' : error.message, error.name === 'AbortError' ? '' : 'error'); }
        finally { loadController = null; setBusy(false); updateOptions(); }
      }

      async function readExampleSources(name, signal) {
        if (!bundledExamplesN3.includes(name)) throw new Error('Unknown bundled example.');
        const loaded = [await fetchSource('examples/' + name, 'examples/' + name, signal)];
        const stem = name.slice(0, -3);
        const companion = [stem + '.n3', stem + '.trig'].find((candidate) => bundledCompanionInputs.includes(candidate));
        if (companion) loaded.push(await fetchSource('examples/input/' + companion, 'examples/input/' + companion, signal));
        return loaded;
      }

      async function loadExample(name, signal) {
        const loaded = await readExampleSources(name, signal);
        originalExample = { name, sources: loaded.map((source) => ({ ...source })) };
        sources = loaded;
        byId('examples').value = name;
        showSources();
      }

      async function restore() {
        restoring = true;
        const url = new URL(location.href);
        const hash = url.hash.slice(1);
        const hashParams = new URLSearchParams(hash);
        const token = url.searchParams.get('state') ?? url.searchParams.get('s') ??
          hashParams.get('state') ?? (/^[gj]\./.test(hash) ? hash : null);
        const stateUrl = url.searchParams.get('stateurl');
        const example = hashParams.get('example') ?? url.searchParams.get('example') ?? url.searchParams.get('ex');
        const shared = token !== null || stateUrl !== null || example !== null;
        let sharedLoaded = false;
        let sharedError = '';
        if (shared) {
          await loadInputs(async (signal) => {
            try {
              if (token !== null) applyState(await unpackState(token));
              else if (stateUrl !== null) applyState(normalizeState(JSON.parse((await fetchSource(stateUrl, '', signal)).text)));
              else {
                applyState(normalizeState({ sources: [{ name: '-', text: defaultProgram, baseIri: null }] }));
                await loadExample(example.endsWith('.n3') ? example : example + '.n3', signal);
              }
              sharedLoaded = true;
              setShareStatus('Opened shared playground. Changes save locally.');
            } catch (error) {
              sharedError = 'Could not open shared playground: ' + error.message;
              setShareStatus(sharedError, 'error');
            }
          });
        } else {
          try {
            const saved = JSON.parse(localStorage.getItem(stateKey) || 'null');
            if (saved) applyState(normalizeState(saved));
            else {
              const previous = localStorage.getItem('eyeron.playground.input');
              const previousData = localStorage.getItem('eyeron.playground.data');
              if (previous !== null) sources[0].text = previous;
              if (previousData?.trim()) sources.push({ name: 'data.trig', text: previousData, baseIri: baseForName('data.trig') });
            }
          } catch { /* An unavailable or outdated saved state does not block the editor. */ }
        }
        showSources();
        updateOptions();
        restoring = false;
        if (!shared || sharedLoaded) scheduleSave();
        return sharedError;
      }

      for (const name of bundledExamplesN3) byId('examples').add(new Option(name, name));
      input.on('change', () => { if (!restoring) { sources[0].text = input.getValue(); scheduleSave(); } });
      proof.on('change', scheduleSave);
      for (const id of ['mode', 'rdf', 'stream', 'stream-messages', 'base-iri', 'max-backward-depth']) {
        byId(id).addEventListener('input', updateOptions);
      }
      byId('stream-messages').addEventListener('change', () => {
        if (byId('stream-messages').checked) { byId('rdf').checked = true; byId('stream').checked = false; byId('mode').value = ''; }
        updateOptions();
      });
      byId('mode').addEventListener('change', () => {
        if (byId('mode').value) byId('stream-messages').checked = false;
        updateOptions();
        if (byId('mode').value === '--check-proof') revealPanel(byId('proof-panel'));
      });
      byId('stream').addEventListener('change', () => { if (byId('stream').checked) byId('stream-messages').checked = false; updateOptions(); });
      byId('rdf').addEventListener('change', () => { if (!byId('rdf').checked) byId('stream-messages').checked = false; updateOptions(); });
      byId('run').addEventListener('click', () => run());
      byId('stop').addEventListener('click', () => {
        if (loadController) loadController.abort();
        else { if (failRun) failRun(new Error('Stopped.')); finishRun = failRun = null; terminateWorker(); }
      });
      byId('examples').addEventListener('change', () => { if (byId('examples').value) loadInputs((signal) => loadExample(byId('examples').value, signal)); });
      byId('input-url-form').addEventListener('submit', (event) => {
        event.preventDefault();
        loadInputs(async (signal) => {
          const source = await fetchSource(byId('input-url').value, '', signal);
          sources = [source];
          originalExample = null;
          byId('examples').value = '';
          showSources();
          byId('input-url').value = '';
        });
      });
      byId('proof-url-form').addEventListener('submit', (event) => {
        event.preventDefault();
        loadInputs(async (signal) => { const source = await fetchSource(byId('proof-url').value, '', signal); proof.setValue(source.text); proofName = source.name; byId('proof-url').value = ''; });
      });
      byId('share-link').addEventListener('click', () => sharePlayground(false));
      byId('create-gist-share').addEventListener('click', () => sharePlayground(true));
      byId('share-url').addEventListener('click', () => byId('share-url').select());
      byId('save-output').addEventListener('click', () => {
        const url = URL.createObjectURL(new Blob([output.getValue()], { type: 'text/plain;charset=utf-8' }));
        const link = document.createElement('a'); link.href = url; link.download = byId('mode').value === '--proof' ? 'proof.n3' : 'output.txt';
        link.click(); setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
      document.addEventListener('keydown', (event) => { if ((event.ctrlKey || event.metaKey) && event.key === 'Enter' && !busy) { event.preventDefault(); run(); } });
      // Fragment navigation in the same tab must restore the linked snapshot too.
      window.addEventListener('hashchange', () => location.reload());
      const restoreError = await restore();
      try { await ensureWorker(); setBusy(false); setStatus(restoreError || 'Ready.', restoreError ? 'error' : ''); }
      catch (error) { setStatus(error.message, 'error'); }
    </script>
  </body>
</html>
